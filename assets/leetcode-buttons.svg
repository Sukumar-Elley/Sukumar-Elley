<svg
  width="900"
  height="80"
  viewBox="0 0 900 80"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>
    <filter
      id="shadow"
      x="-20%"
      y="-30%"
      width="140%"
      height="170%"
    >
      <feDropShadow
        dx="0"
        dy="3"
        stdDeviation="3"
        flood-color="#000000"
        flood-opacity="0.30"
      />
    </filter>

    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFAA18"/>
      <stop offset="100%" stop-color="#FF9D00"/>
    </linearGradient>

    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF3030"/>
      <stop offset="100%" stop-color="#DC2027"/>
    </linearGradient>
  </defs>

  <!-- LEETCODE -->
  <a href="https://leetcode.com/" target="_blank">
    <g filter="url(#shadow)">
      <rect
        x="10"
        y="14"
        width="140"
        height="52"
        rx="26"
        fill="#0B0D10"
        stroke="#34383F"
        stroke-width="1.5"
      />

      <path
        d="M39 29 L46 22 L54 30 L47 37 L40 44"
        stroke="white"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <path
        d="M48 41 C54 47 63 47 69 41"
        stroke="white"
        stroke-width="3"
        stroke-linecap="round"
      />

      <text
        x="68"
        y="45"
        fill="white"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12"
        font-weight="700"
        letter-spacing="1.6"
      >
        LEETCODE
      </text>
    </g>
  </a>

  <!-- VISIT PROFILE -->
  <a href="https://leetcode.com/u/sukumar456/" target="_blank">
    <g filter="url(#shadow)">
      <rect
        x="163"
        y="14"
        width="190"
        height="52"
        rx="26"
        fill="url(#orange)"
      />

      <path
        d="M190 40 H210 M203 33 L210 40 L203 47"
        stroke="white"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <text
        x="222"
        y="45"
        fill="white"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12"
        font-weight="700"
        letter-spacing="1.5"
      >
        VISIT PROFILE
      </text>
    </g>
  </a>

  <!-- PROBLEMS SOLVED -->
  <a href="https://leetcode.com/u/sukumar456/" target="_blank">
    <g filter="url(#shadow)">
      <rect
        x="366"
        y="14"
        width="235"
        height="52"
        rx="26"
        fill="#0B0D10"
        stroke="#34383F"
        stroke-width="1.5"
      />

      <circle
        cx="396"
        cy="40"
        r="9"
        stroke="white"
        stroke-width="2.5"
      />

      <circle
        cx="396"
        cy="40"
        r="3"
        fill="white"
      />

      <text
        x="417"
        y="45"
        fill="white"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12"
        font-weight="700"
        letter-spacing="1.3"
      >
        PROBLEMS SOLVED
      </text>
    </g>
  </a>

  <!-- LIVE TRACKER -->
  <a href="https://leetcode.com/u/sukumar456/" target="_blank">
    <g filter="url(#shadow)">
      <rect
        x="614"
        y="14"
        width="240"
        height="52"
        rx="26"
        fill="url(#red)"
      />

      <circle
        cx="644"
        cy="40"
        r="5"
        fill="white"
      />

      <text
        x="660"
        y="45"
        fill="white"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12"
        font-weight="700"
        letter-spacing="1.6"
      >
        LIVE TRACKER
      </text>
    </g>
  </a>

</svg>

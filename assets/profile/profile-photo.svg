<svg xmlns="http://www.w3.org/2000/svg"
     width="1180"
     height="610"
     viewBox="0 0 1180 610">

  <defs>

    <!-- ============================================== -->
    <!-- ANIMATED CYAN / PURPLE GRADIENT               -->
    <!-- ============================================== -->

    <linearGradient id="asciiGrad"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">

      <stop offset="0%" stop-color="#22D3EE">
        <animate
          attributeName="stop-color"
          values="#22D3EE;#7C3AED;#38BDF8;#22D3EE"
          dur="9s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#7C3AED">
        <animate
          attributeName="stop-color"
          values="#7C3AED;#38BDF8;#22D3EE;#7C3AED"
          dur="9s"
          repeatCount="indefinite"/>
      </stop>

    </linearGradient>


    <!-- ============================================== -->
    <!-- BORDER GRADIENT                                -->
    <!-- ============================================== -->

    <linearGradient id="borderGrad"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">

      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#10B981"/>

    </linearGradient>


    <!-- ============================================== -->
    <!-- BACKGROUND                                     -->
    <!-- ============================================== -->

    <radialGradient id="bgGlow"
                    cx="30%"
                    cy="20%"
                    r="80%">

      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#050816"/>

    </radialGradient>


    <!-- ============================================== -->
    <!-- SCAN BEAM                                     -->
    <!-- ============================================== -->

    <linearGradient id="scanGrad"
                    x1="0%"
                    y1="0%"
                    x2="0%"
                    y2="100%">

      <stop offset="0%"
            stop-color="#22D3EE"
            stop-opacity="0"/>

      <stop offset="45%"
            stop-color="#22D3EE"
            stop-opacity="0.05"/>

      <stop offset="50%"
            stop-color="#A5F3FC"
            stop-opacity="0.65"/>

      <stop offset="55%"
            stop-color="#22D3EE"
            stop-opacity="0.05"/>

      <stop offset="100%"
            stop-color="#7C3AED"
            stop-opacity="0"/>

    </linearGradient>


    <!-- ============================================== -->
    <!-- CRT SCANLINES                                  -->
    <!-- ============================================== -->

    <pattern id="scanlines"
             width="4"
             height="4"
             patternUnits="userSpaceOnUse">

      <rect
        width="4"
        height="1"
        fill="#7DD3FC"
        opacity="0.05"/>

    </pattern>


    <!-- ============================================== -->
    <!-- PORTRAIT REVEAL MASK                            -->
    <!-- ============================================== -->

    <mask id="revealMask"
          maskUnits="userSpaceOnUse"
          x="0"
          y="0"
          width="1180"
          height="620">

      <rect
        x="0"
        y="0"
        width="1180"
        height="0"
        fill="#fff">

        <animate
          attributeName="height"
          from="0"
          to="560"
          dur="2.6s"
          begin="0.2s"
          fill="freeze"
          calcMode="spline"
          keySplines="0.25 0.1 0.25 1"/>

      </rect>

    </mask>


    <!-- ============================================== -->
    <!-- PORTRAIT CLIP                                  -->
    <!-- ============================================== -->

    <clipPath id="portraitClip">

      <rect
        x="28"
        y="48"
        width="460"
        height="440"
        rx="12"/>

    </clipPath>


    <!-- ============================================== -->
    <!-- TEXT STYLES                                    -->
    <!-- ============================================== -->

    <style>

      .key {
        font-family:'Courier New',Consolas,monospace;
        font-size:15px;
        fill:#22D3EE;
        font-weight:bold;
      }

      .value {
        font-family:'Courier New',Consolas,monospace;
        font-size:15px;
        fill:#E5E7EB;
      }

      .cc {
        font-family:'Courier New',Consolas,monospace;
        font-size:15px;
        fill:#475569;
      }

      .head {
        font-family:'Courier New',Consolas,monospace;
        font-size:17px;
        fill:#7C3AED;
        font-weight:bold;
      }

      .accent {
        font-family:'Courier New',Consolas,monospace;
        font-size:15px;
        fill:#10B981;
        font-weight:bold;
      }

      .term-label {
        font-family:'Courier New',Consolas,monospace;
        font-size:12px;
        fill:#64748B;
        letter-spacing:0.5px;
      }

      .scan-label {
        font-family:'Courier New',Consolas,monospace;
        font-size:10px;
        fill:#F87171;
        letter-spacing:1px;
      }

      .panel-title {
        font-family:'Courier New',Consolas,monospace;
        font-size:11px;
        fill:#38BDF8;
        letter-spacing:2px;
        opacity:0.7;
      }

    </style>

  </defs>


  <!-- ============================================== -->
  <!-- BACKGROUND                                     -->
  <!-- ============================================== -->

  <rect
    width="1180"
    height="610"
    rx="18"
    fill="url(#bgGlow)"/>

  <rect
    width="1180"
    height="610"
    rx="18"
    fill="url(#scanlines)"/>


  <!-- ============================================== -->
  <!-- TERMINAL TITLE BAR                             -->
  <!-- ============================================== -->

  <g id="titlebar">

    <rect
      x="3"
      y="3"
      width="1174"
      height="34"
      rx="16"
      fill="#0B1120"
      fill-opacity="0.85"/>


    <!-- Red -->
    <circle
      cx="24"
      cy="20"
      r="5"
      fill="#EF4444">

      <animate
        attributeName="opacity"
        values="1;0.55;1"
        dur="4s"
        repeatCount="indefinite"/>

    </circle>


    <!-- Yellow -->
    <circle
      cx="42"
      cy="20"
      r="5"
      fill="#F59E0B">

      <animate
        attributeName="opacity"
        values="1;0.55;1"
        dur="4s"
        begin="0.3s"
        repeatCount="indefinite"/>

    </circle>


    <!-- Green -->
    <circle
      cx="60"
      cy="20"
      r="5"
      fill="#10B981">

      <animate
        attributeName="opacity"
        values="1;0.55;1"
        dur="4s"
        begin="0.6s"
        repeatCount="indefinite"/>

    </circle>


    <!-- Terminal command -->
    <text
      x="590"
      y="25"
      text-anchor="middle"
      class="term-label">

      sukumar@devos ~ % ./profile.sh --live

    </text>


    <!-- Scanning indicator -->
    <circle
      cx="1122"
      cy="20"
      r="4"
      fill="#F87171">

      <animate
        attributeName="opacity"
        values="1;0.15;1"
        dur="1.1s"
        repeatCount="indefinite"/>

    </circle>


    <text
      x="1132"
      y="24"
      class="scan-label">

      SCANNING

    </text>

  </g>


  <!-- ============================================== -->
  <!-- MAIN CONTENT                                   -->
  <!-- ============================================== -->

  <g transform="translate(0,38)">


    <!-- ============================================ -->
    <!-- PORTRAIT PANEL                               -->
    <!-- ============================================ -->

    <rect
      x="14"
      y="26"
      width="488"
      height="468"
      rx="14"
      fill="#0B1120"
      fill-opacity="0.35"
      stroke="url(#borderGrad)"
      stroke-width="1"
      opacity="0.35"/>


    <!-- ============================================ -->
    <!-- INFORMATION PANEL                            -->
    <!-- ============================================ -->

    <rect
      x="508"
      y="10"
      width="655"
      height="500"
      rx="14"
      fill="#0B1120"
      fill-opacity="0.35"
      stroke="url(#borderGrad)"
      stroke-width="1"
      opacity="0.35"/>


    <!-- Portrait label -->

    <text
      x="30"
      y="24"
      class="panel-title">

      PORTRAIT.MAP

    </text>


    <!-- System label -->

    <text
      x="524"
      y="24"
      class="panel-title">

      SYSTEM.INFO

    </text>


    <!-- ============================================ -->
    <!-- PORTRAIT                                     -->
    <!-- ============================================ -->

    <g mask="url(#revealMask)">


      <!-- Portrait background -->

      <rect
        x="28"
        y="48"
        width="460"
        height="440"
        rx="12"
        fill="#050816"/>


      <!-- ========================================== -->
      <!-- YOUR DOT-MATRIX PORTRAIT                   -->
      <!-- ========================================== -->

      <image
        x="28"
        y="48"
        width="460"
        height="440"
        preserveAspectRatio="xMidYMid slice"
        clip-path="url(#portraitClip)"
        href="assets/profile/portrait.png"/>


      <!-- Portrait border -->

      <rect
        x="28"
        y="48"
        width="460"
        height="440"
        rx="12"
        fill="none"
        stroke="url(#borderGrad)"
        stroke-width="1"
        opacity="0.45"/>

    </g>


    <!-- ============================================ -->
    <!-- SYSTEM INFORMATION                            -->
    <!-- ============================================ -->

    <text
      x="520"
      y="42"
      class="head">

      sukumar@devos

    </text>


    <text
      x="520"
      y="66"
      class="cc">

      .
      <tspan class="key">Subject</tspan>:
      <tspan class="value"> Sukumar-Elley</tspan>

    </text>


    <text
      x="520"
      y="88"
      class="cc">

      .
      <tspan class="key">Role</tspan>:
      <tspan class="value">
        Data Science Undergrad · Python Dev
      </tspan>

    </text>


    <text
      x="520"
      y="110"
      class="cc">

      .
      <tspan class="key">Origin</tspan>:
      <tspan class="value">
        Telangana, India
      </tspan>

    </text>


    <text
      x="520"
      y="132"
      class="cc">

      .
      <tspan class="key">Education</tspan>:
      <tspan class="value">
        B.Tech AI &amp; ML, CGPA 7.8
      </tspan>

    </text>


    <text
      x="520"
      y="154"
      class="cc">

      .
      <tspan class="key">Status</tspan>:
      <tspan class="value">
        Building • Learning • Shipping
      </tspan>

    </text>


    <text
      x="520"
      y="176"
      class="cc">

      .
      <tspan class="key">ToolChain</tspan>:
      <tspan class="value">
        VS Code, Git, Docker, Vercel
      </tspan>

    </text>


    <!-- ============================================ -->
    <!-- CORE LANGUAGES                               -->
    <!-- ============================================ -->

    <text
      x="520"
      y="220"
      class="cc">

      .
      <tspan class="key">Core.Lang</tspan>:
      <tspan class="value">
        Java, Python, R, Scala
      </tspan>

    </text>


    <text
      x="520"
      y="242"
      class="cc">

      .
      <tspan class="key">Core.Frontend</tspan>:
      <tspan class="value">
        React, HTML, CSS, JavaScript
      </tspan>

    </text>


    <text
      x="520"
      y="264"
      class="cc">

      .
      <tspan class="key">Core.Backend</tspan>:
      <tspan class="value">
        Node.js, Flask, Fast APIs, REST APIs
      </tspan>

    </text>


    <text
      x="520"
      y="286"
      class="cc">

      .
      <tspan class="key">Core.Database</tspan>:
      <tspan class="value">
        PostgreSQL, MongoDB, MySQL, Supabase
      </tspan>

    </text>


    <text
      x="520"
      y="308"
      class="cc">

      .
      <tspan class="key">Core.Infra</tspan>:
      <tspan class="value">
        Docker, JWT/RBAC, Microservices
      </tspan>

    </text>


    <!-- ============================================ -->
    <!-- CONTACT                                      -->
    <!-- ============================================ -->

    <text
      x="520"
      y="352"
      class="accent">

      - Contact

    </text>


    <text
      x="520"
      y="374"
      class="cc">

      .
      <tspan class="key">Grid.Mail</tspan>:
      <tspan class="value">
        sukumarelley13431@gmail.com
      </tspan>

    </text>


    <text
      x="520"
      y="396"
      class="cc">

      .
      <tspan class="key">Grid.Portfolio</tspan>:
      <tspan class="value">
        videoportfolio-kohl.vercel.app
      </tspan>

    </text>


    <text
      x="520"
      y="418"
      class="cc">

      .
      <tspan class="key">Grid.LinkedIn</tspan>:
      <tspan class="value">
        sukumar-elley
      </tspan>

    </text>


    <text
      x="520"
      y="440"
      class="cc">

      .
      <tspan class="key">Grid.Github</tspan>:
      <tspan class="value">
        Sukumar-Elley
      </tspan>

    </text>


    <!-- ============================================ -->
    <!-- LIVE STATS                                  -->
    <!-- ============================================ -->

    <text
      x="520"
      y="484"
      class="accent">

      - Live Stats

    </text>


    <text
      x="520"
      y="506"
      class="value">

      See live GitHub stats badges below in README ↓

    </text>

  </g>


  <!-- ============================================== -->
  <!-- MOVING SCAN BEAM                               -->
  <!-- ============================================== -->

  <rect
    x="0"
    y="-70"
    width="1180"
    height="70"
    fill="url(#scanGrad)"
    opacity="0.7"
    style="mix-blend-mode:screen">

    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 -70"
      to="0 680"
      dur="4.2s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ============================================== -->
  <!-- OUTER BORDER                                   -->
  <!-- ============================================== -->

  <rect
    x="3"
    y="3"
    width="1174"
    height="604"
    rx="16"
    fill="none"
    stroke="url(#borderGrad)"
    stroke-width="2"
    opacity="0.8">

    <animate
      attributeName="opacity"
      values="0.5;0.95;0.5"
      dur="3.2s"
      repeatCount="indefinite"/>

  </rect>

</svg>

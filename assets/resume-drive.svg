<svg width="435" height="182" viewBox="0 0 435 182" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Red gradient matching LinkedIn button -->
  <linearGradient id="red" x1="28" y1="41" x2="427" y2="154">
    <stop offset="0" stop-color="#FF1616"/>
    <stop offset="0.55" stop-color="#E50914"/>
    <stop offset="1" stop-color="#C9000B"/>
  </linearGradient>

  <!-- Shadow -->
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow
      dx="0"
      dy="4"
      stdDeviation="5"
      flood-color="#000000"
      flood-opacity="0.35"
    />
  </filter>

</defs>


<!-- Background -->
<rect
  width="435"
  height="182"
  fill="#080B0F"
/>


<!-- Main pill -->
<rect
  x="28"
  y="41"
  width="399"
  height="113"
  rx="57"
  fill="url(#red)"
  filter="url(#shadow)"
/>


<!-- Red border -->
<rect
  x="28"
  y="41"
  width="399"
  height="113"
  rx="57"
  fill="none"
  stroke="#FF171F"
  stroke-width="4"
/>


<!-- Black circular icon area -->
<circle
  cx="101"
  cy="97"
  r="57"
  fill="#090B0F"
/>


<!-- Resume / Document icon -->

<!-- Document -->
<rect
  x="75"
  y="67"
  width="51"
  height="61"
  rx="5"
  fill="white"
/>

<!-- Folded corner -->
<path
  d="M109 67
     L126 84
     L109 84
     Z"
  fill="#090B0F"
/>

<!-- Document lines -->
<rect
  x="85"
  y="91"
  width="28"
  height="5"
  rx="2.5"
  fill="#090B0F"
/>

<rect
  x="85"
  y="102"
  width="32"
  height="5"
  rx="2.5"
  fill="#090B0F"
/>

<rect
  x="85"
  y="113"
  width="23"
  height="5"
  rx="2.5"
  fill="#090B0F"
/>


<!-- RESUME text -->
<text
  x="165"
  y="116"
  fill="white"
  font-family="Arial, Helvetica, sans-serif"
  font-size="49"
  font-weight="700"
  letter-spacing="-1"
>
  Resume
</text>

</svg>

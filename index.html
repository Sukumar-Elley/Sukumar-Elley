<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sukumar Elley's GitHub contribution activity across a rolling 365-day window.">
  <title>Sukumar Elley — Contribution Activity</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f14;
      --panel: #0d0b08;
      --panel-2: #12100d;
      --border: #302716;
      --text: #eee9df;
      --muted: #8b8174;
      --muted-2: #62584b;
      --amber: #f5a623;
      --amber-bright: #ffb238;
      --button-bg: #17130d;
      --button-hover: #211b12;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .page {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .title-row { display: flex; align-items: center; gap: 12px; }

    .title-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid #45403a;
      border-radius: 8px;
      background: #e7e7eb;
      color: #4b4b52;
      font-size: 16px;
    }

    .title { margin: 0; font-size: 27px; font-weight: 650; letter-spacing: -0.5px; }
    .subtitle { margin: 7px 0 0 46px; color: var(--muted); font-size: 13px; }
    .total { white-space: nowrap; color: var(--text); font-size: 14px; font-weight: 600; }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(0,0,0,.22);
    }

    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 56px;
      padding: 0 22px;
      border-bottom: 1px solid #28241f;
    }

    .window-label { color: var(--amber); font-size: 13px; }
    .window-label strong { font-weight: 700; }
    .date-range { color: #d4cabb; font-size: 13px; }

    .chart-viewport {
      position: relative;
      width: 100%;
      height: 390px;
      overflow: hidden;
      touch-action: pan-y;
      user-select: none;
      cursor: grab;
    }

    .chart-viewport.dragging { cursor: grabbing; }
    #graph { width: 100%; height: 100%; }
    #graph svg { display: block; width: 100%; height: 100%; }

    .navigation {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px 10px;
      border-top: 1px solid #28241f;
    }

    .nav-button {
      min-width: 104px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid #423724;
      border-radius: 8px;
      background: var(--button-bg);
      color: #e9dfcf;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease, opacity .15s ease, transform .15s ease;
    }

    .nav-button:hover:not(:disabled) { background: var(--button-hover); border-color: #71592f; transform: translateY(-1px); }
    .nav-button:active:not(:disabled) { transform: translateY(0); }
    .nav-button:disabled { opacity: .3; cursor: not-allowed; }

    .position { flex: 1; min-width: 0; }
    .position-label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 7px; color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .position-label strong { color: #cdbfa9; }

    .progress { width: 100%; height: 4px; overflow: hidden; border-radius: 999px; background: #272016; }
    .progress-value { height: 100%; width: 100%; border-radius: inherit; background: var(--amber); transition: width .22s ease; }

    .boundary-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 18px 17px;
      color: var(--muted-2);
      font-size: 11px;
    }

    .boundary-controls button {
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
    }

    .boundary-controls button:hover:not(:disabled) { color: var(--amber); }
    .boundary-controls button:disabled { opacity: .3; cursor: not-allowed; }

    .hint { margin-top: 12px; color: #6e7681; font-size: 12px; text-align: center; }
    .footer { margin-top: 18px; color: #6e7681; font-size: 12px; text-align: center; }

    .error { padding: 40px; color: #f85149; font: 13px ui-monospace, monospace; }

    @media (max-width: 700px) {
      .page { width: calc(100% - 20px); padding: 28px 0; }
      .header { flex-direction: column; }
      .title { font-size: 23px; }
      .subtitle { margin-left: 46px; }
      .total { font-size: 13px; }
      .chart-header { align-items: flex-start; flex-direction: column; justify-content: center; padding: 12px 16px; gap: 4px; }
      .chart-viewport { height: 320px; }
      .navigation { gap: 8px; padding-left: 10px; padding-right: 10px; }
      .nav-button { min-width: 42px; padding: 0 10px; }
      .nav-button .button-text { display: none; }
      .position-label { font-size: 10px; }
      .boundary-controls { padding-left: 10px; padding-right: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .nav-button, .progress-value { transition: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <div class="title-row">
          <span class="title-icon" aria-hidden="true">↗</span>
          <h1 class="title">Contribution Activity</h1>
        </div>
        <p class="subtitle">Sukumar Elley · Full 365-day history</p>
      </div>
      <div id="total" class="total">Loading...</div>
    </header>

    <section class="card" aria-label="365-day GitHub contribution activity">
      <div class="chart-header">
        <div id="windowLabel" class="window-label"><strong>30</strong> day window</div>
        <div id="dateRange" class="date-range">Loading...</div>
      </div>

      <div id="graphViewport" class="chart-viewport" tabindex="0" aria-label="Contribution graph. Use left and right arrow keys or swipe to navigate.">
        <div id="graph"></div>
      </div>

      <div class="navigation">
        <button id="olderButton" class="nav-button" type="button" aria-label="Show previous 30 days">
          <span aria-hidden="true">←</span><span class="button-text">Older</span>
        </button>

        <div class="position">
          <div id="position" class="position-label"></div>
          <div class="progress" role="progressbar" aria-label="Timeline position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
            <div id="progressValue" class="progress-value"></div>
          </div>
        </div>

        <button id="newerButton" class="nav-button" type="button" aria-label="Show next 30 days">
          <span class="button-text">Newer</span><span aria-hidden="true">→</span>
        </button>
      </div>

      <div class="boundary-controls">
        <button id="oldestButton" type="button">Oldest</button>
        <span>Swipe, drag, or use the arrow keys</span>
        <button id="latestButton" type="button">Latest</button>
      </div>
    </section>

    <div class="footer">Automatically updated daily by GitHub Actions.</div>
  </main>

  <script src="./contribution-graph.js"></script>
</body>
</html>

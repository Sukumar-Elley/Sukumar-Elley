<svg
  width="900"
  height="80"
  viewBox="0 0 900 80"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- Soft shadow -->
    <filter
      id="shadow"
      x="-20%"
      y="-30%"
      width="140%"
      height="170%"
    >
      <feDropShadow
        dx="0"
        dy="3"
        stdDeviation="3"
        flood-color="#000000"
        flood-opacity="0.30"
      />
    </filter>

    <!-- Orange -->
    <linearGradient
      id="orange"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop offset="0%" stop-color="#FFAA18"/>
      <stop offset="100%" stop-color="#FF9D00"/>
    </linearGradient>

    <!-- Red -->
    <linearGradient
      id="red"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop offset="0%" stop-color="#EF3030"/>
      <stop offset="100%" stop-color="#DC2027"/>
    </linearGradient>

  </defs>


  <!-- ========================================= -->
  <!-- LEETCODE -->
  <!-- ========================================= -->

  <g filter="url(#shadow)">

    <rect
      x="10"
      y="14"
      width="170"
      height="52"
      rx="26"
      fill="#0B0D10"
      stroke="#34383F"
      stroke-width="1.5"
    />

    <!-- LeetCode icon -->
    <path
      d="M39 29
         L46 22
         L54 30
         L47 37
         L40 44"
      stroke="white"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <path
      d="M48 41
         C54 47 63 47 69 41"
      stroke="white"
      stroke-width="3"
      stroke-linecap="round"
    />

    <text
      x="82"
      y="47"
      fill="#FFFFFF"
      font-family="Arial, Helvetica, sans-serif"
      font-size="13"
      font-weight="700"
      letter-spacing="2"
    >
      LEETCODE
    </text>

  </g>


  <!-- ========================================= -->
  <!-- VISIT PROFILE -->
  <!-- ========================================= -->

  <g filter="url(#shadow)">

    <rect
      x="195"
      y="14"
      width="190"
      height="52"
      rx="26"
      fill="url(#orange)"
    />

    <!-- Small external-link icon -->
    <path
      d="M225 35
         H241
         M234 27
         L242 35
         L234 43"
      stroke="white"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <text
      x="255"
      y="47"
      fill="white"
      font-family="Arial, Helvetica, sans-serif"
      font-size="13"
      font-weight="700"
      letter-spacing="1.8"
    >
      VISIT PROFILE
    </text>

  </g>


  <!-- ========================================= -->
  <!-- PROBLEMS SOLVED -->
  <!-- ========================================= -->

  <g filter="url(#shadow)">

    <rect
      x="400"
      y="14"
      width="235"
      height="52"
      rx="26"
      fill="#0B0D10"
      stroke="#34383F"
      stroke-width="1.5"
    />

    <!-- Target -->
    <circle
      cx="430"
      cy="40"
      r="9"
      stroke="#FFFFFF"
      stroke-width="2.5"
    />

    <circle
      cx="430"
      cy="40"
      r="3"
      fill="#FFFFFF"
    />

    <text
      x="451"
      y="47"
      fill="#FFFFFF"
      font-family="Arial, Helvetica, sans-serif"
      font-size="13"
      font-weight="700"
      letter-spacing="1.5"
    >
      PROBLEMS SOLVED
    </text>

  </g>


  <!-- ========================================= -->
  <!-- LIVE TRACKER -->
  <!-- ========================================= -->

  <g filter="url(#shadow)">

    <rect
      x="650"
      y="14"
      width="240"
      height="52"
      rx="26"
      fill="url(#red)"
    />

    <!-- Live indicator -->
    <circle
      cx="680"
      cy="40"
      r="5"
      fill="white"
    />

    <text
      x="696"
      y="47"
      fill="white"
      font-family="Arial, Helvetica, sans-serif"
      font-size="13"
      font-weight="700"
      letter-spacing="1.8"
    >
      LIVE TRACKER
    </text>

  </g>

</svg>

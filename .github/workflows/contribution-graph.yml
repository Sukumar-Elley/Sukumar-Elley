# .github/workflows/contribution-graph.yml
#
# One workflow, two outputs, both from the same GitHub contribution
# calendar pull:
#
#   1. assets/contribution-graph.svg
#      A static 30-day badge — this is what your README embeds
#      via <img src=".../assets/contribution-graph.svg">.
#
#   2. docs/contributions.json
#      The full 365-day dataset docs/index.html + docs/contribution-graph.js
#      expect (fetch("./contributions.json")).
#      Once GitHub Pages is turned on for this repo (Settings → Pages →
#      Deploy from a branch → main → /docs), that page becomes a live,
#      scrollable contribution history at:
#        https://sukumar-elley.github.io/Sukumar-Elley/
#
# Runs daily and on demand (Actions tab → this workflow → Run workflow).

name: Update contribution graph

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC — edit as you like
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-graph:
    runs-on: ubuntu-latest
    env:
      GITHUB_USER: ${{ github.repository_owner }}
      BADGE_WINDOW_DAYS: 30
      TOTAL_DAYS: 365
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install beautifulsoup4 --quiet

      - name: Generate badge SVG and contributions.json
        run: |
          cat << 'PYEOF' > _generate_graph.py
          import os, re, json, urllib.request
          from bs4 import BeautifulSoup

          USER = os.environ["GITHUB_USER"]
          BADGE_WINDOW = int(os.environ.get("BADGE_WINDOW_DAYS", "30"))
          TOTAL_DAYS = int(os.environ.get("TOTAL_DAYS", "365"))

          # ---- Pull the public contribution calendar ----
          url = f"https://github.com/users/{USER}/contributions"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          html = urllib.request.urlopen(req).read().decode("utf-8")
          soup = BeautifulSoup(html, "html.parser")

          cells = soup.find_all(attrs={"data-date": True})
          tooltips = {t.get("for"): t.get_text(strip=True) for t in soup.find_all("tool-tip")}

          data = []
          for c in cells:
              date = c.get("data-date")
              text = tooltips.get(c.get("id"), "")
              m = re.match(r"(\d+)\s+contributions?", text)
              count = int(m.group(1)) if m else 0
              data.append({"date": date, "count": count})
          data.sort(key=lambda d: d["date"])

          months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]
          fullm = ["January","February","March","April","May","June","July",
                   "August","September","October","November","December"]

          def monthday(s):
              y,m,d = map(int, s.split("-")); return f"{months[m-1]} {d}"
          def fulldate(s):
              y,m,d = map(int, s.split("-")); return f"{fullm[m-1]} {d}, {y}"

          # ================================================================
          # 1) assets/contribution-graph.svg — static badge, latest N days
          # ================================================================
          win = data[-BADGE_WINDOW:]
          W, H = 720, 260
          padL, padR, padT, padB = 34, 14, 16, 28
          plotW, plotH = W - padL - padR, H - padT - padB
          maxVal = max(4, max(d["count"] for d in win))
          n = len(win)
          stepX = plotW / (n - 1) if n > 1 else 0

          def xFor(i): return padL + i * stepX
          def yFor(v): return padT + plotH - (v / maxVal) * plotH

          grid, ylab = [], []
          for t in range(5):
              val = round((maxVal/4)*t)
              y = yFor(val)
              grid.append(f'<line class="gridline" x1="{padL}" x2="{W-padR}" y1="{y:.2f}" y2="{y:.2f}" stroke-dasharray="2,3"/>')
              ylab.append(f'<text class="y-label" x="{padL-8}" y="{y+3:.2f}" text-anchor="end">{val}</text>')

          pts = [(xFor(i), yFor(d["count"])) for i, d in enumerate(win)]
          line_d = "M " + " L ".join(f"{x:.2f},{y:.2f}" for x, y in pts)
          area_d = line_d + f" L {pts[-1][0]:.2f},{padT+plotH:.2f} L {pts[0][0]:.2f},{padT+plotH:.2f} Z"

          pt_svg = []
          for i, (x, y) in enumerate(pts):
              d = win[i]
              title = f"{fulldate(d['date'])} — {d['count']} contribution{'s' if d['count']!=1 else ''}"
              pt_svg.append(f'<circle class="pt" cx="{x:.2f}" cy="{y:.2f}" r="3.5"><title>{title}</title></circle>')

          label_every = 4 if n > 20 else (2 if n > 10 else 1)
          xlab = []
          for i, d in enumerate(win):
              if i % label_every != 0 and i != n - 1:
                  continue
              day = int(d["date"].split("-")[2])
              xlab.append(f'<text class="axis-label" x="{xFor(i):.2f}" y="{H-8}" text-anchor="middle">{day}</text>')

          range_label = f"{monthday(win[0]['date'])} – {fulldate(win[-1]['date'])}"

          svg = f'''<svg viewBox="0 0 {W} {H+40}" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', ui-monospace, monospace">
            <style>
              .gridline {{ stroke: #2a2013; stroke-width: 1; }}
              .line-path {{ fill: none; stroke: #ffb238; stroke-width: 2; }}
              .area-fill {{ fill: url(#areaGrad); }}
              .pt {{ fill: #120d08; stroke: #ffb238; stroke-width: 2; }}
              .axis-label, .y-label {{ fill: #5f5138; font-size: 10px; }}
              .title-text {{ fill: #f3e3c8; font-size: 13px; }}
              .n-text {{ fill: #ffb238; font-weight: 600; font-size: 13px; }}
            </style>
            <defs>
              <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffb238" stop-opacity="0.35"/>
                <stop offset="100%" stop-color="#ffb238" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <rect x="0" y="0" width="{W}" height="{H+40}" rx="10" fill="#120d08" stroke="#2a2013"/>
            <text class="title-text" x="20" y="28"><tspan class="n-text">{n}</tspan> day window — {range_label}</text>
            <g transform="translate(0,40)">
              {"".join(grid)}
              {"".join(ylab)}
              <path class="area-fill" d="{area_d}"/>
              <path class="line-path" d="{line_d}"/>
              {"".join(pt_svg)}
              {"".join(xlab)}
            </g>
          </svg>'''

          os.makedirs("assets", exist_ok=True)
          with open("assets/contribution-graph.svg", "w") as f:
              f.write(svg)

          # ================================================================
          # 2) docs/contributions.json — full dataset for the scrollable page
          #    Schema expected by docs/contribution-graph.js:
          #      { totalContributions, startDate, endDate,
          #        contributions: [{date, count}, ...] }
          # ================================================================
          full_win = data[-TOTAL_DAYS:]
          payload = {
              "totalContributions": sum(d["count"] for d in full_win),
              "startDate": fulldate(full_win[0]["date"]),
              "endDate": fulldate(full_win[-1]["date"]),
              "contributions": full_win,
          }

          os.makedirs("docs", exist_ok=True)
          with open("docs/contributions.json", "w") as f:
              json.dump(payload, f, separators=(",", ":"))
          PYEOF
          python3 _generate_graph.py
          rm _generate_graph.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- assets/contribution-graph.svg docs/contributions.json; then
            git add assets/contribution-graph.svg docs/contributions.json
            git commit -m "chore: update contribution graph and dataset"
            git push
          else
            echo "No changes — skipping commit."
          fi

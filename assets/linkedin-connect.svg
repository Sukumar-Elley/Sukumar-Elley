<svg width="435" height="182" viewBox="0 0 435 182" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Red gradient -->
    <linearGradient id="redGradient" x1="0" y1="0" x2="435" y2="182" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF1515"/>
      <stop offset="55%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#C9000B"/>
    </linearGradient>

    <!-- Subtle shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
        dx="0"
        dy="4"
        stdDeviation="5"
        flood-color="#000000"
        flood-opacity="0.35"
      />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="435" height="182" fill="#080B0F"/>

  <!-- Main red pill -->
  <rect
    x="28"
    y="41"
    width="399"
    height="113"
    rx="57"
    fill="url(#redGradient)"
    filter="url(#shadow)"
  />

  <!-- Red outline -->
  <rect
    x="28"
    y="41"
    width="399"
    height="113"
    rx="57"
    fill="none"
    stroke="#FF171F"
    stroke-width="4"
  />

  <!-- Black LinkedIn circle -->
  <circle
    cx="101"
    cy="97"
    r="57"
    fill="#090B0F"
  />

  <!-- LinkedIn "i" -->
  <circle
    cx="73"
    cy="71"
    r="8"
    fill="white"
  />

  <rect
    x="65"
    y="84"
    width="16"
    height="44"
    rx="1"
    fill="white"
  />

  <!-- LinkedIn "n" -->
  <path
    d="M91 84H106V90.5C110.5 85.5 116.5 82 125 82C140 82 147 91.5 147 107V128H131V109C131 101 128 96 122 96C116 96 112 100 112 108V128H91V84Z"
    fill="white"
  />

  <!-- Connect text -->
  <text
    x="180"
    y="116"
    fill="white"
    font-family="Arial, Helvetica, sans-serif"
    font-size="51"
    font-weight="700"
    letter-spacing="-1"
  >
    Connect
  </text>

</svg>
